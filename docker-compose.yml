services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sellstice
      POSTGRES_PASSWORD: sellstice
      POSTGRES_DB: sellstice
    ports:
      - "5432:5432"
    volumes:
      - sellstice-db-data:/var/lib/postgresql/data

volumes:
  sellstice-db-data:
